<div class="team-selector">
  <div class="team-selector__icon" aria-hidden="true">
    <nz-icon nzType="team" />
  </div>

  <div class="team-selector__content">
    <span class="team-selector__label">{{ 'app.activeTeam' | translate }}</span>

    <nz-select
      class="team-selector__select"
      [ngModel]="teamContext.selectedTeamId()"
      (ngModelChange)="selectTeam($event)"
      [nzLoading]="loading()"
      [nzPlaceHolder]="'app.selectTeam' | translate"
      nzBorderless
      [attr.aria-label]="'app.activeTeam' | translate"
    >
      @for (team of teams(); track team.id) {
        <nz-option [nzValue]="team.id" [nzLabel]="team.name" />
      }
    </nz-select>
  </div>
</div>
