<nz-drawer
  [nzTitle]="(editingMember() ? 'team.editMemberTitle' : 'team.addMemberTitle') | translate"
  [nzVisible]="addMemberOpen()"
  [nzWidth]="480"
  [nzClosable]="!creatingMember()"
  [nzMaskClosable]="!creatingMember()"
  (nzOnClose)="closeAddMember()"
>
  <ng-container *nzDrawerContent>
    <form nz-form nzLayout="vertical" [formGroup]="addMemberForm">
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'team.name' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'team.nameError' | translate">
          <input
            nz-input
            type="text"
            formControlName="name"
            maxlength="200"
            [placeholder]="'team.namePlaceholder' | translate"
          />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'team.email' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'team.emailError' | translate">
          <input
            nz-input
            type="email"
            formControlName="email"
            maxlength="320"
            [placeholder]="'team.emailPlaceholder' | translate"
          />
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label nzRequired>{{ 'team.role' | translate }}</nz-form-label>
        <nz-form-control>
          <nz-select formControlName="role">
            @for (role of memberRoles; track role.value) {
              <nz-option [nzValue]="role.value" [nzLabel]="role.label | translate"></nz-option>
            }
          </nz-select>
        </nz-form-control>
      </nz-form-item>
      <nz-form-item>
        <nz-form-label>{{ 'team.providerUserId' | translate }}</nz-form-label>
        <nz-form-control [nzErrorTip]="'team.providerUserIdError' | translate">
          <input
            nz-input
            type="text"
            formControlName="providerUserId"
            maxlength="200"
            [placeholder]="'team.optional' | translate"
          />
        </nz-form-control>
      </nz-form-item>
      <div class="drawer-actions">
        <button nz-button type="button" [disabled]="creatingMember()" (click)="closeAddMember()">
          {{ 'team.cancel' | translate }}
        </button>
        <button
          nz-button
          nzType="primary"
          type="button"
          [nzLoading]="creatingMember()"
          [disabled]="addMemberForm.invalid || creatingMember()"
          (click)="saveMember()"
        >
          {{ (editingMember() ? 'team.saveChanges' : 'team.addMember') | translate }}
        </button>
      </div>
    </form>
  </ng-container>
</nz-drawer>
